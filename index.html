<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔬 Quiz Ciências 6º Ano - Aventura Científica</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded', cursive, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #FFE5B4, #FFB6C1, #B0E0E6, #98FB98);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .game-container {
            width: 100%;
            max-width: 750px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 50px;
            padding: 35px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 0 0 8px #FFD700, 0 0 0 12px #FFA500;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .game-container::before {
            content: "🧪🔬🧬";
            position: absolute;
            top: -10px;
            left: 20px;
            font-size: 30px;
            opacity: 0.3;
            transform: rotate(-10deg);
        }

        .game-container::after {
            content: "🌱🦠🔭";
            position: absolute;
            bottom: -10px;
            right: 20px;
            font-size: 30px;
            opacity: 0.3;
            transform: rotate(10deg);
        }

        h1 {
            text-align: center;
            font-size: 2.4rem;
            color: #FF4500;
            text-shadow: 4px 4px 0 #FFD700, 6px 6px 0 rgba(0,0,0,0.1);
            margin-bottom: 20px;
            letter-spacing: 2px;
            word-break: break-word;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* TELA INICIAL */
        .welcome-box {
            text-align: center;
            padding: 10px 0 20px;
        }

        .welcome-box p {
            font-size: 1.3rem;
            color: #2E8B57;
            margin: 15px 0;
            background: #FFFACD;
            padding: 15px;
            border-radius: 30px;
            border: 3px dashed #FFA500;
        }

        .emoji-grande {
            font-size: 5rem;
            margin: 10px 0;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .btn {
            background: linear-gradient(180deg, #FFD700, #FFA500);
            border: none;
            border-radius: 60px;
            padding: 18px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #4B0082;
            cursor: pointer;
            box-shadow: 0 8px 0 #B8860B, 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.1s;
            margin: 12px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 2px solid #FFF8DC;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #B8860B, 0 15px 25px rgba(0,0,0,0.2);
            background: linear-gradient(180deg, #FFEC8B, #FFB347);
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #B8860B, 0 5px 15px rgba(0,0,0,0.2);
        }

        /* TELA PERGUNTAS */
        .header-quiz {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: #FFE4B5;
            padding: 10px 20px;
            border-radius: 40px;
            border: 3px solid #FF8C00;
        }

        .pergunta-numero {
            font-size: 1.2rem;
            font-weight: bold;
            color: #8B4513;
            background: #FFF;
            padding: 5px 15px;
            border-radius: 30px;
            border: 2px solid #FFA500;
        }

        .pontuacao {
            font-size: 1.4rem;
            font-weight: bold;
            color: #006400;
            background: #FFF;
            padding: 5px 20px;
            border-radius: 30px;
            border: 2px solid #32CD32;
        }

        .pergunta-texto {
            font-size: 1.6rem;
            color: #1E3A8A;
            text-align: center;
            margin: 25px 0 20px;
            line-height: 1.4;
            font-weight: bold;
            background: #E0FFFF;
            padding: 20px;
            border-radius: 30px;
            border: 4px solid #00CED1;
            width: 100%;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }

        .opcoes-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-bottom: 15px;
        }

        .opcao {
            background: #F0F8FF;
            border: 4px solid #87CEEB;
            border-radius: 50px;
            padding: 16px 25px;
            font-size: 1.3rem;
            color: #2C3E50;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-weight: bold;
            box-shadow: 0 5px 0 #4682B4;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .opcao:hover {
            background: #E6F2FF;
            transform: scale(1.02);
            border-color: #1E90FF;
        }

        .opcao:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #4682B4;
        }

        .opcao .letra {
            background: #1E90FF;
            color: white;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.3rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .opcao.correta {
            background: #C8E6C9 !important;
            border-color: #2E7D32 !important;
            box-shadow: 0 5px 0 #1B5E20 !important;
        }

        .opcao.errada {
            background: #FFCDD2 !important;
            border-color: #C62828 !important;
            box-shadow: 0 5px 0 #8B0000 !important;
        }

        .opcao.desabilitada {
            pointer-events: none;
            opacity: 0.8;
        }

        .feedback {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 30px;
            text-align: center;
            margin: 10px 0;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: popIn 0.3s;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .feedback.acerto {
            background: #A5D6A7;
            color: #1B5E20;
            border: 4px solid #2E7D32;
        }

        .feedback.erro {
            background: #EF9A9A;
            color: #B71C1C;
            border: 4px solid #C62828;
        }

        /* TELA FINAL */
        .resultado-box {
            text-align: center;
            width: 100%;
        }

        .resultado-emoji {
            font-size: 6rem;
            margin: 10px 0;
        }

        .resultado-texto {
            font-size: 2rem;
            color: #4B0082;
            margin: 10px 0;
        }

        .pontuacao-final {
            font-size: 3rem;
            color: #FF4500;
            font-weight: bold;
            background: #FFFACD;
            display: inline-block;
            padding: 15px 40px;
            border-radius: 60px;
            border: 5px solid #FFD700;
            margin: 15px 0;
            box-shadow: 0 8px 0 #DAA520;
        }

        .mensagem-final {
            font-size: 1.4rem;
            color: #006400;
            background: #E8F5E9;
            padding: 20px;
            border-radius: 30px;
            border: 3px dashed #4CAF50;
            margin: 20px 0;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 600px) {
            .game-container {
                padding: 25px 18px;
                border-radius: 35px;
            }
            h1 { font-size: 1.7rem; }
            .pergunta-texto { font-size: 1.2rem; padding: 15px; }
            .opcao { font-size: 1rem; padding: 12px 16px; }
            .opcao .letra { width: 32px; height: 32px; font-size: 1rem; }
            .btn { font-size: 1.2rem; padding: 14px 25px; }
            .pontuacao-final { font-size: 2.2rem; padding: 10px 25px; }
            .resultado-emoji { font-size: 4rem; }
            .feedback { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🔬 AVENTURA CIENTÍFICA 🌍</h1>

    <!-- TELA INICIAL -->
    <div id="telaInicio" class="screen active">
        <div class="welcome-box">
            <div class="emoji-grande">🧪🌟</div>
            <p>Bem-vindo, pequeno cientista!<br>Teste seus conhecimentos de Ciências do 6º ano!</p>
            <p style="font-size:1rem; background:#FFE4E1;">🌱 Serão 10 perguntas sobre seres vivos, água, ar e muito mais!</p>
            <button class="btn" onclick="iniciarJogo()">▶ COMEÇAR</button>
        </div>
    </div>

    <!-- TELA DO QUIZ -->
    <div id="telaQuiz" class="screen">
        <div class="header-quiz">
            <span class="pergunta-numero" id="numeroPergunta">1/10</span>
            <span class="pontuacao" id="pontuacaoDisplay">⭐ 0</span>
        </div>
        <div class="pergunta-texto" id="perguntaTexto">Carregando...</div>
        <div class="opcoes-container" id="opcoesContainer"></div>
        <div class="feedback" id="feedback"></div>
    </div>

    <!-- TELA FINAL -->
    <div id="telaFinal" class="screen">
        <div class="resultado-box">
            <div class="resultado-emoji" id="resultadoEmoji">🏆</div>
            <div class="resultado-texto">FIM DO QUIZ!</div>
            <div class="pontuacao-final" id="pontuacaoFinal">0/10</div>
            <div class="mensagem-final" id="mensagemFinal"></div>
            <button class="btn" onclick="reiniciarJogo()">🔄 JOGAR NOVAMENTE</button>
        </div>
    </div>
</div>

<script>
    // ==================== BANCO DE PERGUNTAS ====================
    const perguntas = [
        {
            pergunta: "Qual é o principal gás que os seres humanos precisam respirar para viver?",
            opcoes: ["Gás Carbônico", "Oxigênio", "Nitrogênio", "Hélio"],
            correta: 1 // índice do array
        },
        {
            pergunta: "Qual é o maior planeta do Sistema Solar?",
            opcoes: ["Terra", "Marte", "Júpiter", "Saturno"],
            correta: 2
        },
        {
            pergunta: "As plantas produzem seu próprio alimento através de qual processo?",
            opcoes: ["Respiração", "Fotossíntese", "Digestão", "Fermentação"],
            correta: 1
        },
        {
            pergunta: "Qual é o estado físico da água quando ela está em forma de gelo?",
            opcoes: ["Líquido", "Gasoso", "Sólido", "Plasma"],
            correta: 2
        },
        {
            pergunta: "Qual desses animais é um mamífero?",
            opcoes: ["Tartaruga", "Golfinho", "Sapo", "Tubarão"],
            correta: 1
        },
        {
            pergunta: "Qual é a camada da Terra onde vivemos?",
            opcoes: ["Manto", "Núcleo", "Crosta Terrestre", "Magma"],
            correta: 2
        },
        {
            pergunta: "Qual é o principal componente do ar atmosférico?",
            opcoes: ["Oxigênio", "Nitrogênio", "Gás Carbônico", "Hidrogênio"],
            correta: 1
        },
        {
            pergunta: "Qual desses é um recurso natural renovável?",
            opcoes: ["Petróleo", "Carvão Mineral", "Energia Solar", "Gás Natural"],
            correta: 2
        },
        {
            pergunta: "Qual é a função das raízes nas plantas?",
            opcoes: ["Realizar fotossíntese", "Absorver água e nutrientes", "Produzir flores", "Liberar oxigênio"],
            correta: 1
        },
        {
            pergunta: "Qual é o nome do satélite natural da Terra?",
            opcoes: ["Sol", "Lua", "Marte", "Vênus"],
            correta: 1
        }
    ];

    // ==================== VARIÁVEIS DE ESTADO ====================
    let perguntaAtual = 0;
    let pontuacao = 0;
    let respondeu = false; // controla se já respondeu a pergunta atual

    // ==================== ELEMENTOS DO DOM ====================
    const telaInicio = document.getElementById('telaInicio');
    const telaQuiz = document.getElementById('telaQuiz');
    const telaFinal = document.getElementById('telaFinal');
    const numeroPergunta = document.getElementById('numeroPergunta');
    const pontuacaoDisplay = document.getElementById('pontuacaoDisplay');
    const perguntaTexto = document.getElementById('perguntaTexto');
    const opcoesContainer = document.getElementById('opcoesContainer');
    const feedback = document.getElementById('feedback');
    const pontuacaoFinal = document.getElementById('pontuacaoFinal');
    const resultadoEmoji = document.getElementById('resultadoEmoji');
    const mensagemFinal = document.getElementById('mensagemFinal');

    // ==================== FUNÇÕES ====================

    function iniciarJogo() {
        perguntaAtual = 0;
        pontuacao = 0;
        respondeu = false;
        telaInicio.classList.remove('active');
        telaQuiz.classList.add('active');
        telaFinal.classList.remove('active');
        atualizarPontuacao();
        carregarPergunta();
    }

    function carregarPergunta() {
        respondeu = false;
        feedback.textContent = '';
        feedback.className = 'feedback';
        const q = perguntas[perguntaAtual];

        // Atualiza cabeçalho
        numeroPergunta.textContent = `${perguntaAtual + 1}/${perguntas.length}`;

        // Atualiza texto da pergunta
        perguntaTexto.textContent = q.pergunta;

        // Limpa e cria opções
        opcoesContainer.innerHTML = '';
        const letras = ['A', 'B', 'C', 'D'];

        q.opcoes.forEach((opcao, index) => {
            const btn = document.createElement('div');
            btn.classList.add('opcao');
            btn.innerHTML = `<span class="letra">${letras[index]}</span> ${opcao}`;
            btn.addEventListener('click', () => verificarResposta(index, btn));
            opcoesContainer.appendChild(btn);
        });
    }

    function verificarResposta(indiceSelecionado, elementoClicado) {
        if (respondeu) return;
        respondeu = true;

        const q = perguntas[perguntaAtual];
        const todasOpcoes = document.querySelectorAll('.opcao');
        const acertou = (indiceSelecionado === q.correta);

        // Desabilita todas as opções
        todasOpcoes.forEach(op => op.classList.add('desabilitada'));

        // Marca a correta e a errada (se for o caso)
        todasOpcoes[q.correta].classList.add('correta');
        if (!acertou) {
            elementoClicado.classList.add('errada');
        }

        // Atualiza pontuação
        if (acertou) {
            pontuacao++;
            feedback.textContent = '✅ Muito bem! Você acertou! 🎉';
            feedback.className = 'feedback acerto';
        } else {
            feedback.textContent = `❌ Ops! A resposta correta era: ${q.opcoes[q.correta]}`;
            feedback.className = 'feedback erro';
        }
        atualizarPontuacao();

        // Avança para próxima pergunta após 2 segundos
        setTimeout(() => {
            perguntaAtual++;
            if (perguntaAtual < perguntas.length) {
                carregarPergunta();
            } else {
                finalizarJogo();
            }
        }, 2000);
    }

    function atualizarPontuacao() {
        pontuacaoDisplay.textContent = `⭐ ${pontuacao}`;
    }

    function finalizarJogo() {
        telaQuiz.classList.remove('active');
        telaFinal.classList.add('active');

        const total = perguntas.length;
        pontuacaoFinal.textContent = `${pontuacao}/${total}`;

        // Mensagem e emoji baseados na pontuação
        if (pontuacao === total) {
            resultadoEmoji.textContent = '🏆🌟';
            mensagemFinal.textContent = 'PERFEITO! Você é um gênio da ciência! Parabéns!';
        } else if (pontuacao >= total * 0.7) {
            resultadoEmoji.textContent = '🎉😄';
            mensagemFinal.textContent = 'Muito bom! Você mandou muito bem em Ciências!';
        } else if (pontuacao >= total * 0.5) {
            resultadoEmoji.textContent = '👍😊';
            mensagemFinal.textContent = 'Bom trabalho! Continue estudando para melhorar ainda mais!';
        } else {
            resultadoEmoji.textContent = '📚💪';
            mensagemFinal.textContent = 'Não desanime! Estude mais um pouquinho e tente de novo. Você consegue!';
        }
    }

    function reiniciarJogo() {
        telaFinal.classList.remove('active');
        iniciarJogo();
    }

    // ==================== INICIALIZAÇÃO ====================
    // Garante que a tela inicial está ativa ao carregar
    window.onload = () => {
        telaInicio.classList.add('active');
        telaQuiz.classList.remove('active');
        telaFinal.classList.remove('active');
    };
</script>

</body>
</html>
